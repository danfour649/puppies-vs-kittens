name: Web

# Builds the HTML5 game (the full house) and keeps it as an artifact.
# On a push to main it also publishes GitHub Pages, if Pages is
# enabled for the repo. The export is single-threaded GL Compatibility,
# which is what Godot's web template can run without cross-origin isolation.
on:
  push:
    branches: [main, "cursor/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export Web
        run: bash scripts/export-web.sh
      - name: Web size budget
        run: |
          set -euo pipefail
          pck_bytes="$(stat -c%s godot3d/build/web/index.pck)"
          wasm_bytes="$(stat -c%s godot3d/build/web/index.wasm)"
          budget=$((15 * 1024 * 1024))
          pck_mib="$(awk -v n="$pck_bytes" 'BEGIN { printf "%.2f", n/1048576 }')"
          wasm_mib="$(awk -v n="$wasm_bytes" 'BEGIN { printf "%.2f", n/1048576 }')"
          {
            echo "### Web size"
            echo ""
            echo "| file | bytes | MiB |"
            echo "| --- | ---: | ---: |"
            echo "| index.pck | ${pck_bytes} | ${pck_mib} |"
            echo "| index.wasm | ${wasm_bytes} | ${wasm_mib} |"
            echo ""
            echo "Pack budget is 15 MiB. The pack is ${pck_mib} MiB."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$pck_bytes" -gt "$budget" ]; then
            echo "index.pck is ${pck_bytes} bytes, over the 15 MiB budget" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: willie-aggie-web
          path: godot3d/build/web
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: godot3d/build/web
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
