name: Desktop

# Forward+ desktop builds on every push. A merge to main also
# replaces the rolling "latest" GitHub Release. The web demo stays
# on GL Compatibility; these binaries use the project renderer.
on:
  push:
    branches: [main, "cursor/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export desktop
        run: bash scripts/export-desktop.sh
      - name: Upload desktop zips
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            godot3d/build/desktop/WillieAndAggie-linux-x86_64.zip
            godot3d/build/desktop/WillieAndAggie-windows-x86_64.zip
            godot3d/build/desktop/WillieAndAggie-macos.zip
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          notes="$(printf '%s\n' \
            "Forward+ desktop builds from \`${GITHUB_SHA}\`." \
            "" \
            "- Linux x86_64" \
            "- Windows x86_64" \
            "- macOS universal, ad-hoc signed. Gatekeeper will ask you to open it from Finder." \
            "" \
            "The web demo stays on GL Compatibility. These builds are the full-detail game.")"
          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "Latest desktop build" \
            --latest \
            --notes "$notes" \
            godot3d/build/desktop/WillieAndAggie-linux-x86_64.zip \
            godot3d/build/desktop/WillieAndAggie-windows-x86_64.zip \
            godot3d/build/desktop/WillieAndAggie-macos.zip
